<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>McDonalds | Оценка</title>
    <link rel="stylesheet" href="rating.css">
    <link rel="icon" href="./img/icon.png">
</head>

<body>
    <main class="main">
        <header class="header">
            <a href="main.html">
                <img class="icon" src="./img/icon.png" alt="Иконка">
            </a>
            <nav class="nav">
                <a href="main.html" class="nav-link">Главная</a>
                <a href="about.html" class="nav-link">О нас</a>

            <button class="back-btn">

        </header>
        <div class="content">
            <h1 class="title">Оцените нашу работу</h1>
            <div class="btns-wrapper-center">

            <div class="res-wrapper">
                <p class="res"></p>
            </div>
        </div>
        <footer class="footer">
            <div class="info-footer">
                <p class="info-email">mcdonaldsofficial@gmail.com</p>
