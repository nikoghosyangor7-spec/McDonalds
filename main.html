<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>McDonalds | Главная</title>
    <link rel="stylesheet" href="main.css">
    <link rel="icon" href="./img/icon.png">
</head>

<body>
    <main class="main">
        <header class="header">
            <a href="main.html">
                <img class="icon" src="./img/icon.png" alt="Иконка">
            </a>
            <nav class="nav">
                <a href="main.html" class="nav-link">Главная</a>
                <a href="about.html" class="nav-link">О нас</a>
                <a href="menu.html" class="nav-link">Меню</a>
            </nav>
            <button class="back-btn">
                <a href="index.html" class="back-link">Выход</a>
            </button>
        </header>
        <div class="content">
            <h1 class="title"> Добро пожаловать на сайт «Макдоналдс»! </h1>
            <h2 class="grid-title">! Скидки !</h2>
            <div class="grid-wrapper">
                <div class="grid">
                    <div class="card">
                        <div class="eats-wrapper">
                            <img class="cheesburger" src="./img/cheesburger.png" alt="cheesburger">
                            <img class="cola" src="./img/cola.png" alt="cola">
                        </div>
                        <p class="name">Чизбургер + кола</p>
                        <p class="price">1300 ֏</p>
                        <button class="btn">
                            Заказать
                        </button>
                    </div>
                    <div class="card">
                        <div class="eats-wrapper">
                            <img class="double-cheesburger" src="./img/double-cheesburger.png" alt="cheesburger">
                            <img class="cola" src="./img/cola.png" alt="cola" style="width: 68%; margin-left: -60px;">
                        </div>
                        <p class="name">Двойной чизбургер + кола</p>
                        <p class="price">1700 ֏</p>
                        <button class="btn">
                            Заказать
                        </button>
                    </div>
                    <div class="card">
                        <div class="eats-wrapper">
                            <img class="double-cheesburger" src="./img/humburger.png" alt="cheesburger">
                            <img class="cola" src="./img/cola.png" alt="cola" style="margin-left: -75px;">
                        </div>
                        <p class="name">Гамбургер + кола</p>
                        <p class="price">1200 ֏</p>
                        <button class="btn">
                            Заказать
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <footer class="footer">
            <div class="info-footer">
                <p class="info-email">mcdonaldsofficial@gmail.com</p>
                <p class="info-tel">011 111 111</p>
                <a href="rating.html" target="_blank" class="footer-link">Оценить</a>
            </div>
        </footer>
    </main>
    <script src="main.js" defer></script>
</body>

</html>
